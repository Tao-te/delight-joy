<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Небесная чайная</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; color: #66566f;
  font-family: Georgia, serif;
  background: #fff7f3;
}
header { text-align: center; padding: 24px 12px; }
h1 { font-weight: normal; font-size: clamp(28px,5vw,48px); margin: 8px; }
header p { color: #987f9a; }
.scene {
  min-height: 900px; position: relative; overflow: hidden;
  max-width: 1100px; margin: auto;
  background: linear-gradient(#b9d1ec,#eee0f0 48%,#fff0df);
}
.sun {
  position: absolute; right: 15%; top: 8%;
  width: 110px; height: 110px; border-radius: 50%;
  background: #fff3cc; box-shadow: 0 0 60px #fff6d5;
}
.cloud {
  position: absolute; top: 28%; left: 8%;
  width: 160px; height: 38px; border-radius: 50%;
  background: #fffaf0; opacity: .8;
  box-shadow: 30px -16px 0 4px #fffaf0, 65px 0 0 #fffaf0;
}
.roof {
  position: absolute; bottom: 0; width: 100%; height: 28%;
  background: linear-gradient(#fffdf9,#e8dce7);
  border-top: 4px solid white;
}
.leg {
  position: absolute; top: 40%; left: 45%; width: 10%;
  height: 52%; background: #ddcbd7;
  }
.table {
  position: absolute; width: min(82%,600px); height: 260px;
  left: 22.5%; bottom: 1%; transform: translateX(-50%);
}
.tabletop {
  position: absolute; top: 0; width: 100%; height: 58%;
  border-radius: 50%; background: #fffaf5;
  border: 3px solid #e8d5e2;
  box-shadow: 0 15px 24px #806a8625;
}
.plate {
  position: absolute; z-index: 2; left: 10%; top: 10%;
  width: 28%; height: 33%; border-radius: 50%;
  border: 8px double #ead7e3; background: #fff;
  font-size: 48px; cursor: pointer;
}
.tablet {
  position: absolute; z-index: 3; left: 40%; top: -10%;
  width: 32%; height: 80%; border: 7px solid #80788e;
  border-radius: 14px; background: #faf0f6;
  padding: 10px; cursor: pointer; overflow: auto;
}
.tablet h2 { font-size: 16px; font-weight: normal; }
.tablet button {
  display: block; width: 90%; padding: 7px;
  margin: 8px auto; border: 1px solid #ead8e4;
  background: #fffaf5; color: #66566f; cursor: pointer;
}
.phone {
  position: absolute; z-index: 3; right: 8%; top: 6%;
  font-size: 65px; cursor: pointer; border: 0;
  background: transparent;
}
.phone svg{width:100%;height:100%;overflow:visible}
/* ✨ Старинный золотой блеск */
.phone svg {
  filter:
    drop-shadow(0 3px 2px #8a653b55)
    drop-shadow(0 0 7px #f1d69a88);
  transition: filter 0.4s ease;
}

.phone:hover svg {
  filter:
    drop-shadow(0 5px 4px #8a653b77)
    drop-shadow(0 0 12px #f5d995);
}
.candle {
  position: absolute; z-index: 3; right: 20%; top: 2%;
  cursor: pointer; border: 0; background: transparent;
  font-size: 40px;
}
.hint {
  position: absolute; bottom: 3%; width: 100%;
  text-align: center; font: 11px Arial,sans-serif;
  letter-spacing: 2px; color: #927b96;
}
.overlay {
  display: none; position: fixed; z-index: 10; inset: 0;
  background: #352a4777; align-items: center; justify-content: center;
  padding: 20px;
}
.overlay.show { display: flex; }
.letter {
  max-width: 520px; width: 100%; max-height: 80vh;
  overflow: auto; padding: 35px; background: #fffaf3;
  border: 2px solid #ead5e2; line-height: 1.8;
  white-space: pre-line;
}
.letter button {
  float: right; border: 0; background: transparent;
  font-size: 22px; cursor: pointer;
}
footer { text-align: center; padding: 24px; color: #987f9a; }
@media(max-width:600px) {
  .scene { min-height: 620px; }
  .table { width: 94%; bottom: 12%; }
  .tablet { left: 31%; width: 37%; }
  .phone { right: 2%; font-size: 48px; }
  .candle { right: 3%; }
  .plate { left: 5%; width: 40%; }
}
/* Увеличиваем предметы на столе */
.table {
  transform: scale(1.8);
  transform-origin: center;
}
.plate {
  transform: scale(0.85);
}

.tablet {
  transform: scale(0.4);
  transform-origin: center;
}

/* Закрытый планшет показывает только обложку */
.tablet h2,
.tablet button {
  display: Меню;
}

/* По нажатию планшет раскрывается и показывает меню */
.tablet.open {
  transform: scale(0.8);
  z-index: 20;
  overflow: auto;
  background: #faf0f6;
  box-shadow: 0 12px 30px #a78bbd55;
}

.tablet.open h2,
.tablet.open button {
  display: block;
}

.phone {
  transform: scale(0.8);
  transform-origin: center;
}

/* Отодвигаем ножку за столешницу */
.tabletop {
  z-index: 2;
}

.tableleg {
  z-index: 1;
}

.foot {
  z-index: 0;
}
/* Плавные движения предметов */
.plate,
.tablet,
.phone,
.candle {
  transition: transform 0.35s ease, filter 0.35s ease;
}

/* Тарелка слегка увеличивается */
.plate:hover {
  transform: scale(1);
  filter: drop-shadow(0 6px 12px #d8a5b655);
}

/* Планшет приподнимается */
.tablet:hover {
  transform: scale(0.2);
  filter: drop-shadow(0 8px 12px #a58aa855);
}

/* При наведении открытый планшет сохраняет увеличенный размер */
.tablet.open:hover {
  transform: scale(0.8);
}

/* Телефон становится чуть заметнее */
.phone:hover {
  transform: translateY(-5px) rotate(-2deg);
  filter: drop-shadow(0 8px 10px #c7a2c855);
}

/* Свеча слегка увеличивается */
.candle:hover {
  transform: scale(1.06);
  filter: drop-shadow(0 0 10px #ffdfaa);
}
/* ☁️ Плавное движение облаков */
.c1 {
  animation: cloudDriftOne 18s ease-in-out infinite;
}

.c2 {
  animation: cloudDriftTwo 23s ease-in-out infinite;
}

@keyframes cloudDriftOne {
  10%, 100% {
    transform: translateX(10) scale(.8);
  }
  50% {
    transform: translateX(32px) scale(.8);
  }
}

@keyframes cloudDriftTwo {
  0%, 100% {
    transform: translateX(0) scale(.65);
  }
  50% {
    transform: translateX(-28px) scale(.65);
  }
}
/* ☀️ Мягкое сияние солнца */
.sun {
  animation: sunGlow 5s ease-in-out infinite alternate;
}

@keyframes sunGlow {
  from {
    box-shadow: 0 0 55px #fff4d688;
  }
  to {
    box-shadow: 0 0 95px #fff4d6dd;
  }
}

/* 🕊️ Птички слегка покачиваются */
.birds {
  animation: birdsFloat 4s ease-in-out infinite alternate;
}

@keyframes birdsFloat {
  from {
    transform: translateY(0) rotate(-7deg);
  }
  to {
    transform: translateY(-7px) rotate(-4deg);
  }
}
/* ☁️ Более заметное движение облаков */
.scene .cloud.c1 {
  animation: skyCloudLeft 7s ease-in-out infinite alternate;
}

.scene .cloud.c2 {
  animation: skyCloudRight 9s ease-in-out infinite alternate;
}

@keyframes skyCloudLeft {
  from { transform: translateX(-1060px) scale(996.668); }
  to   { transform: translateX(1065px) scale(996.668); }
}

@keyframes skyCloudRight {
  from { transform: translateX(9999px) scale(998.65); }
  to   { transform: translateX(-9999px) scale(998.65); }
}
/* ☀️ Дыхание солнечного света */
.scene .sun {
  animation: skySunGlow 3s ease-in-out infinite alternate;
}

@keyframes skySunGlow {
  from {
    box-shadow: 0 0 40px 8px #fff4d688;
  }
  to {
    box-shadow: 0 0 90px 24px #fff4d6dd;
  }
}
/* ✧ Нежный дизайн планшета */
.tablet {
  border: 3px solid #b9a8c9;
  border-radius: 18px;
  background: linear-gradient(
    145deg,
    #fffdfb,
    #eee5f6
  );
  box-shadow:
    0 10px 25px #74618130,
    inset 0 0 0 3px #ffffffaa;
  transition:
    box-shadow 0.35s ease,
    border-color 0.35s ease;
}

/* Мягкое сияние при наведении */
.tablet:hover {
  border-color: #d5b2ce;
  box-shadow:
    0 12px 30px #a78bbd55,
    inset 0 0 0 3px #ffffffcc;
}

/* ✧ Красивые кнопки блюд */
.tablet button {
  border: 1px solid #e5d4e5;
  border-radius: 12px;
  background: #fffaf8;
  color: #65556f;
  padding: 10px;
  cursor: pointer;
  transition:
    background 0.25s ease,
    box-shadow 0.25s ease;
}

/* При наведении кнопка становится розовой */
.tablet button:hover {
  background: #f8e8f1;
  box-shadow: 0 4px 12px #c7a2c833;
}
/* Закрытый планшет аккуратно обрезает содержимое */
.tablet:not(.open) {
  overflow: hidden;
}
/* ✧ Обложка меню «Небесная чайная» ✧ */
.tablet:not(.open) .tablet-screen {
background:
radial-gradient(circle at 50% 32%, #fffdf8 0 9%, transparent 10%),
linear-gradient(145deg, #fffaf2, #eee3f5 55%, #f6e2eb);
border: 1px solid #e3cddd;
box-shadow: inset 0 0 0 3px #ffffffa8;
gap: 7px;
}

.tablet:not(.open) .tablet-screen::before {
content: "✧ ☾ ✧";
display: block;
color: #b18ba9;
font-size: clamp(12px, 2vw, 21px);
letter-spacing: .18em;
margin-bottom: 2px;
}

.tablet:not(.open) .tablet-screen b {
font-size: clamp(10px, 1.35vw, 16px);
color: #66566f;
text-align: center;
}

.tablet:not(.open) .tablet-screen span:not(.tabletClose) {
font-size: clamp(7px, 1vw, 11px);
text-align: center;
letter-spacing: .04em;
}

.tablet:not(.open) .tabletClose {
display: none;
}

.tablet:not(.open) .tablet-screen::after {
content: "ОТКРОЙ МЕНЮ";
display: block;
margin-top: 5px;
padding: 5px 10px;
border: 1px solid #dfc8dc;
border-radius: 20px;
color: #997b9b;
font: clamp(6px, .8vw, 9px) Arial, sans-serif;
letter-spacing: .12em;
}

.tablet.open .tablet-screen::before,
.tablet.open .tablet-screen::after {
display: none;
}
/* 🌙 Обложка планшета в закрытом состоянии */
#tablet:not(.open) {
  background: linear-gradient(
    145deg,
    #fffaf2,
    #eee3f5 55%,
    #f6e2eb
  );
  border: 3px solid #b9a8c9;
  border-radius: 18px;
  box-shadow:
    0 10px 25px #74618130,
    inset 0 0 0 3px #ffffffaa;
}

/* Прячем список блюд, пока меню закрыто */
#tablet:not(.open) h2,
#tablet:not(.open) > button {
  display: none;
}

/* Украшение на обложке */
#tablet:not(.open)::before {
  content: "✧  ☾  ✧";
  position: absolute;
  top: 22%;
  left: 0;
  width: 100%;
  text-align: center;
  color: #b18ba9;
  font-size: clamp(18px, 2.5vw, 28px);
}

/* Название и приглашение */
#tablet:not(.open)::after {
  content: " ✧ МЕНЮ ✧  ";
  position: absolute;
  top: 52%;
  left: 5%;
  width: 90%;
  text-align: center;
  color: #806b8d;
  font-size: clamp(8px, 1vw, 12px);
  line-height: 1.8;
  letter-spacing: 1px;
}

#tablet.open {
  background: #fffaf5;
  border-color: #b9a8c9;
  overflow-y: auto;
}

#tablet.open h2,
#tablet.open > button {
  display: block;
}
/* ✨ Изящный старинный телефон */
.phone {
filter:
drop-shadow(0 5px 4px #8b694344)
drop-shadow(0 0 8px #e8c98730);
transition:
transform 0.35s ease,
filter 0.35s ease;
}

.phone:hover {
transform: translateY(-5px) scale(1.025);
filter:
drop-shadow(0 8px 6px #8b694355)
drop-shadow(0 0 14px #f2d69a88);
}

.phone:active {
transform: scale(0.98);
}

.phone-label {
color: #9a7954;
text-shadow: 0 1px 0 #fff5df;
}
/* ✨ Золотой корпус старинного телефона */
button.phone {
  background: linear-gradient(
    145deg,
    #fff1c9 0%,
    #d8b36c 35%,
    #f8e2a5 55%,
    #b58a48 100%
  );
  border: 2px solid #b58a48;
  border-radius: 45% 45% 38% 38%;
  box-shadow:
    inset 0 0 0 2px #fff0c2,
    inset 0 0 12px #a7783a55,
    0 6px 14px #79604444,
    0 0 12px #f1d69a55;
  font-size: clamp(30px, 5vw, 54px);
  text-shadow: 0 2px 2px #88643866;
}

/* ===== ДЕСЕРТЫ НА ТАРЕЛКЕ ===== */
#plate { padding: 0; font-size: 0; display: flex; align-items: center; justify-content: center; }
#plate svg { height: 125%; width: auto; aspect-ratio: 1 / 1; flex: none; display: block; transform: translateY(-9%); }

/* ===== ТЕЛЕФОН (ажурный, XIX век) ===== */
button.phone {
  background: none; border: 0; border-radius: 0; box-shadow: none;
  text-shadow: none; padding: 0; font-size: 0;
  width: clamp(56px, 9vw, 84px); aspect-ratio: 3 / 4;
}

/* ===== СВЕЧА (латунный подсвечник) ===== */
button.candle {
  background: none; border: 0; padding: 0; font-size: 0;
  width: clamp(30px, 4.6vw, 46px); aspect-ratio: 64 / 100;
}
.candle svg { width: 100%; height: 100%; overflow: visible; }
.candle .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite alternate; }
.candle .glow { animation: glowPulse 2.2s ease-in-out infinite alternate; }
@keyframes flicker { from { transform: scale(1,1) rotate(-2deg); } to { transform: scale(1.07,.93) rotate(2deg); } }
@keyframes glowPulse { from { opacity: .45; } to { opacity: .9; } }

/* ===== СТАРИННОЕ МЕНЮ ===== */
/* закрытое: кожаный переплёт с золотом */
#tablet {
  font-family: Georgia, "Times New Roman", serif;
  border: 3px solid #b58a48; border-radius: 4px 10px 10px 4px;
  background: linear-gradient(135deg, #8f5b70, #6a3e55);
  box-shadow: 0 10px 24px #4b2a3b55, inset 0 0 0 3px #e7c98a99, inset 5px 0 9px #00000033;
}
#tablet:not(.open):hover { transform: scale(.46); border-color: #d8b36c; }
#tablet:not(.open)::before { content: "❦"; color: #e7c98a; top: 20%; }
#tablet:not(.open)::after { content: "МЕНЮ"; color: #e7c98a; letter-spacing: .3em; top: 50%; }
/* открытое: пергамент с рамкой */
#tablet.open, #tablet.open:hover {
  transform: scale(.85);
  background: radial-gradient(circle at 50% 40%, #fbf1da, #f0e0bd);
  color: #5a4256; border: 3px double #9a7447; padding: 8px; overflow-y: auto;
  box-shadow: 0 14px 30px #4b2a3b66, inset 0 0 18px #c9a46a55;
}
#tablet .menu-body { display: none; }
#tablet.open .menu-body {
  display: block; text-align: center; padding: 8px 8px 4px;
  border: 1px solid #b58a48; outline: 1px solid #b58a4866; outline-offset: -5px;
}
#tablet h2 { font-size: 15px; font-style: italic; letter-spacing: .06em; margin: 2px 0 6px; color: #6a3e55; }
#tablet h2 small { display: block; font-size: 9px; font-style: normal; letter-spacing: .3em; text-transform: uppercase; color: #9a7447; }
#tablet .orn { color: #b58a48; font-size: 12px; letter-spacing: .3em; }
#tablet .dish {
  display: flex; align-items: center; gap: 7px; width: 100%; margin: 0; padding: 4px 2px;
  border: 0; border-bottom: 1px dotted #b58a48; border-radius: 0;
  background: none; box-shadow: none; text-align: left; color: #5a4256; font-family: inherit;
}
#tablet .dish:hover { background: #efdcb8; box-shadow: none; }
#tablet .dish svg { width: 26px; height: 26px; flex: none; }
#tablet .dish b { display: block; font-size: 12px; font-weight: normal; }
#tablet .dish i { display: block; font-size: 9.5px; color: #9a7447; }

/* ===== БАГРОВАЯ ЛУНА (пасхалка на свече) ===== */
.scene, .sun, .cloud { transition: box-shadow .8s, width .8s, opacity .8s; }
body.blood .scene { background: linear-gradient(#2a050b, #7a0f1e 48%, #3a0a12); }
body.blood .scene .sun { background: radial-gradient(circle at 40% 35%, #e0303d, #8c0a16 70%); box-shadow: 0 0 70px #ff2a3d, 0 0 170px #8c0a16; animation: none; }
body.blood .scene .cloud { background: #2a0a10; opacity: .95; width: 240px; }
body.blood .scene .cloud::before, body.blood .scene .cloud::after { background: #2a0a10; }
body.blood #plate svg, body.blood .dish svg { filter: saturate(1.3) brightness(.85) hue-rotate(-10deg); }
.drop { position: absolute; top: 70%; width: 4px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #c4101f; opacity: 0; animation: bleed 1.4s linear infinite; }
@keyframes bleed { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(340px); opacity: .1; } }
/* ===== ФАЙЛЫ БЛЮД (песни, произведения) ===== */
#links { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
a.filelink { display: block; padding: 8px 12px; border: 1px solid #d9b8d6; border-radius: 14px; background: #fff7fb; color: inherit; text-decoration: none; text-align: center; }
a.filelink:hover { background: #f6e6f2; }
/* ===== ПОДСКАЗКА ===== */
.help { position: fixed; right: 16px; bottom: 16px; z-index: 5; width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 2px solid #b58a48; background: radial-gradient(circle at 35% 30%, #fff3d6, #e7c98a); color: #6a3e55; font: italic 22px Georgia, serif; cursor: pointer; box-shadow: 0 4px 12px #4b2a3b44; transition: transform .2s; }
.help:hover { transform: scale(1.08); }
.help.pulse { animation: helpPulse 1.4s ease-in-out infinite; }
@keyframes helpPulse { 0%, 100% { box-shadow: 0 0 0 0 #e7c98a99; } 50% { box-shadow: 0 0 0 14px #e7c98a00; } }
  /* ===== ТЕЛЕФОНЫ: уменьшаем стол целиком, чтобы всё влезало ===== */
@media (max-width: 700px) {
  .table { width: 600px; left: 50%; transform: translateX(-50%) scale(.8); transform-origin: center bottom; }
  #tablet.open, #tablet.open:hover { transform: scale(1.3); }
}
@media (max-width: 480px) {
  .table { transform: translateX(-50%) scale(.58); }
  #tablet.open, #tablet.open:hover { transform: scale(1.9); height: 96%; }
  .plate { transform: scale(1.05); }
  #tablet:not(.open) { transform: scale(.5); }
  button.phone { width: 100px; }
  button.candle { width: 62px; right: 25%; }
}
</style>
</head>
<body>
  <div class="agegate" id="agegate" role="dialog" aria-modal="true" aria-labelledby="agetitle">
  <div class="agebox">
    <div class="ageorn">❦</div>
    <h2 id="agetitle">Иллюзорная мечта</h2>
    <div class="age18">18+</div>
    <p id="agetext">Здесь живут тихие, но мрачные истории: в них бывают страшные сцены, кровь и тревожные темы.<br>Вам уже исполнилось 18 лет?</p>
    <div class="agebtns">
      <button id="ageyes">Да, мне есть 18</button>
      <button id="ageno">Нет</button>
    </div>
  </div>
</div>
<style>
body.locked { overflow: hidden; }
.agegate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 50% 35%, #6a3e55, #2a1220); font-family: Georgia, "Times New Roman", serif; }
.agegate.hide { display: none; }
.agebox { max-width: 420px; text-align: center; padding: 28px 24px; background: #fbf1da; color: #5a4256; border: 3px double #9a7447; border-radius: 8px; box-shadow: 0 20px 50px #0008; }
.ageorn { color: #b58a48; font-size: 22px; }
.agebox h2 { margin: 4px 0; font-style: italic; color: #6a3e55; }
.age18 { display: inline-block; margin: 6px 0 10px; padding: 6px 12px; border: 2px solid #9a1c2c; border-radius: 50%; color: #9a1c2c; font-weight: bold; }
.agebox p { line-height: 1.5; }
.agebtns button { margin: 6px; padding: 9px 18px; border: 1px solid #b58a48; border-radius: 14px; background: #fff7fb; color: #5a4256; font: inherit; cursor: pointer; }
.agebtns button:hover { background: #efdcb8; }
</style>
<script>
(function () {
  const gate = document.getElementById("agegate");
  let ok = false;
  try { ok = localStorage.getItem("age18") === "yes"; } catch (e) {}
  if (ok) { gate.classList.add("hide"); return; }
  document.body.classList.add("locked");
  document.getElementById("ageyes").onclick = () => {
    try { localStorage.setItem("age18", "yes"); } catch (e) {}
    gate.classList.add("hide");
    document.body.classList.remove("locked");
  };
  document.getElementById("ageno").onclick = () => {

<script>

<path d="M16 52 L84 52 L80 77 L20 77Z" fill="#5b4b8a"/>

<path d="M26 50 L34 56 M38 46 L46 52 M50 44 L58 50 M62 46 L70 52 M34 48 L26 54 M46 45 L38 51 M58 44 L50 49 M70 47 L62 53" fill="none" stroke="#8b6a3a" stroke-width=".9"/>
<circle cx="30" cy="66" r="5" fill="#3d3a7a"/><circle cx="46" cy="68" r="5" fill="#3d3a7a"/><circle cx="62" cy="66" r="5" fill="#3d3a7a"/><circle cx="74" cy="69" r="4" fill="#3d3a7a"/>

{ name: "Клубничный торт", sub: "вожделений",
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g stroke="#8b5560" stroke-width="1.3" stroke-linejoin="round">
<rect x="20" y="58" width="60" height="14" rx="3" fill="#f7b9c4"/><rect x="18" y="52" width="64" height="7" rx="3" fill="#fffaf0"/>
<rect x="20" y="40" width="60" height="13" rx="3" fill="#f7b9c4"/>
<path d="M18 40 Q18 32 27 32 L73 32 Q82 32 82 40 L78 40 Q76 46 73 40 L58 40 Q56 47 53 40 L30 40 Q28 45 25 40Z" fill="#fffaf0"/>

<g fill="#ffd6dc"><circle cx="45" cy="24" r="1"/><circle cx="52" cy="22" r="1"/><circle cx="56" cy="28" r="1"/><circle cx="47" cy="30" r="1"/></g></svg>` }
];
dishes[0].story = "- Что эхом отдается у тебя в душе?\n\nДевушка- Я хочу, чтобы меня слышали\n\n- Для такой одинокой, как ты, это действительно стоит того?\n\nДевушка- Да, я в этом уверена\n\n- Тогда быть этому ";
dishes[1].story = "♥♥ Даже Луна парой закрывает Солнце, готовали ты\n\nДевушка- Но Солнце настолько яркое, что даже Луне не удается затмить его свет\n\n♥♥ Верно\n\nДевушка- Поэтому, я хочу быть такой же играющей, как и Солнце";
dishes[2].story = "Сегодня вечером ожидается долгожданное выступление группы ''Ярче звезд'', как вы уже видите: зрители выстроились в предкушении шоу. Желаем удачи участницам!";


dishes[2].files = [
  { label: "🎵 Ярче звезд",   url: "Love.mp3", kind: "audio" }
]; 
let selected = 0;

function renderMenu() {
  const box = document.getElementById("menuList");
  dishes.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "dish";
    b.innerHTML = d.svg + "<span><b>" + d.name + "</b><i>" + d.sub + "</i></span>";
    b.onclick = e => { e.stopPropagation(); choose(i); };
    box.appendChild(b);
  });
}

function choose(index) {
  selected = index;
  const p = document.getElementById("plate");
  p.innerHTML = dishes[index].svg;
  p.title = dishes[index].name + " — нажми, чтобы прочитать";
  document.getElementById("tablet").classList.remove("open");
}

/* Планшет открывается по нажатию, а не при наведении */
const tablet = document.getElementById("tablet");
tablet.addEventListener("click", () => tablet.classList.toggle("open"));
tablet.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    tablet.classList.toggle("open");
  }
});
document.addEventListener("click", event => {
  if (!tablet.contains(event.target)) tablet.classList.remove("open");
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") tablet.classList.remove("open");
});

function openLetter(title, text, files) {
  document.getElementById("title").textContent = title;
  document.getElementById("story").textContent = text;
  const box = document.getElementById("links");
  box.innerHTML = "";
  (files || []).forEach(f => {
    const a = document.createElement("a");
    a.className = "filelink";
    a.textContent = f.label;
    a.href = f.url;
    if (f.kind === "audio") a.onclick = e => { e.preventDefault(); playAudio(f.url); };
    else { a.target = "_blank"; a.rel = "noopener"; }
    box.appendChild(a);
  });
  document.getElementById("overlay").classList.add("show");
}
let audio = null, audioUrl = "";
function playAudio(url) {
  if (audio && audioUrl === url && !audio.paused) { audio.pause(); return; }
  if (audio) audio.pause();
  audio = new Audio(url); audioUrl = url;
  audio.play().catch(() => {});
}
function openFile(f) {
  if (f.kind === "audio") playAudio(f.url);
  else window.open(f.url, "_blank");
}

function closeLetter() {
  document.getElementById("overlay").classList.remove("show");
}

let plateClicks = 0, plateTimer;
document.getElementById("plate").onclick = () => {
  plateClicks++;
  clearTimeout(plateTimer);
  plateTimer = setTimeout(() => {
    const d = dishes[selected], files = d.files || [];
    if (plateClicks >= 2 && files[plateClicks - 2]) openFile(files[plateClicks - 2]);
    else openLetter(d.name, d.story, files);
    plateClicks = 0;
  }, 600);
};

let blood = false;
const calls = [
  { title: "Планетос Эвхарис", text: "Слышен непрекращающийся хохот, бьющийся о заблуджие звезды" },
  { title: "Гликория", text: "Мир полный ''сладостей'', которым правит юная дева с неприличным аппетитом" },
  { title: "ХХХХХХХХ", text: "Кровь как звездный газ, а плоть- звездная пыль; они так схожи. Заботятся ли они о своих отпрысках?\n\nНо на одно они горасты- дары" },
  { title: "-", text: "Что ты? Что я?\n\n Кто ты? Кто я?\n\n Мы?\n\n•−• •− −•• −−− ••• − −••−" }
];
const scaryCalls = [
  { title: "550\n\n50", text: "•−• •− −•• −−− ••• − −••−" },
  { title: "350\n\n40", text: "− •− −−− −••••− − •" },
  { title: "550\n\n50", text: "•••• •− •••• •− •••• •− •••• •−" },
  { title: "350\n\n40", text: "−•− •−•• ••− −••• −• •• −•− •−" }
];
const easterEgg = { title: "♥♥ ", text:"Боже-боже сколько желаний, я даже крошки в рот не успела поместить, ну что же делать работа не ждет\n\n25.10.26" };
const easterEggBlood = {
  title: "Линия занята...",
  text: ""
};
const EASTER_CLICKS = 3, CLICK_WINDOW = 600;
let phoneClicks = 0, phoneTimer, lastCall = -1;
document.getElementById("phone").onclick = () => {
  phoneClicks++;
  clearTimeout(phoneTimer);
  phoneTimer = setTimeout(() => {
    if (phoneClicks >= EASTER_CLICKS) {
      const egg = blood ? easterEggBlood : easterEgg;
openLetter(egg.title, egg.text);

    } else {
      const list = blood ? scaryCalls : calls;
      let i;
      do { i = Math.floor(Math.random() * list.length); } while (i === lastCall);
      lastCall = i;
      openLetter(list[i].title, list[i].text);
    }
    phoneClicks = 0;
  }, CLICK_WINDOW);
};

const WISH = { title: "", text: "Что они все скрывают?" };
const DARK_WISH = { title: "-", text: "Поздравляю, ты все-таки прикоснулся к нашей обители. Понял ли ты, что я тебе говорю, вот же смех" };

/* страшные названия и истории блюд (индексы совпадают с dishes) */
const scary = [
  { name: "Треснувший голубой лайт-стик", sub: "", story: "Что" },
  { name: "Сгнивший корж", sub: "", story: "Ты" },
  { name: "Глазированная клубника", sub: "", story: "Ищешь" },
  { name: "Кари из ночной кастрюли", sub: "хозяйка не вышла к столу", story: "Кастрюля булькает с самого рассвета. Хозяйки давно не видно, а ложка почему-то уже в твоей руке. Ешь, пока не остыло. Остыть оно не успеет." }
];
dishes.forEach((d, i) => {
  const o = { name: d.name, sub: d.sub, story: d.story };
  ["name", "sub", "story"].forEach(k => Object.defineProperty(d, k, { get: () => blood ? scary[i][k] : o[k] }));
});

function bleed(on) {
  const c = document.querySelector(".cloud");
  c.querySelectorAll(".drop").forEach(d => d.remove());
  if (!on) return;
  for (let k = 0; k < 16; k++) {
    const d = document.createElement("i");
    d.className = "drop";
    d.style.left = (6 + Math.random() * 88) + "%";
    d.style.animationDelay = (Math.random() * 1.6) + "s";
    d.style.animationDuration = (1.1 + Math.random() * 0.9) + "s";
    c.appendChild(d);
  }
}

function toggleBlood() {
  blood = !blood;
  lastCall = -1;
  document.body.classList.toggle("blood", blood);
  document.querySelector("#tablet h2 small").textContent = blood ? "Багровой трапезной" : "Радость";
  document.getElementById("menuList").innerHTML = "";
  renderMenu();
  choose(selected);
  bleed(blood);
}

const CANDLE_CLICKS = 3;   // сколько кликов подряд по свече нужно (можно поставить 2)
let candleClicks = 0, candleTimer;
document.getElementById("candle").onclick = () => {
  candleClicks++;
  clearTimeout(candleTimer);
  candleTimer = setTimeout(() => {
    if (candleClicks >= CANDLE_CLICKS) toggleBlood();
    else { const w = blood ? DARK_WISH : WISH; openLetter(w.title, w.text); }
    candleClicks = 0;
  }, 600);
};

document.getElementById("overlay").onclick = event => {
  if (event.target.id === "overlay") closeLetter();
};

document.onkeydown = event => {
  if (event.key === "Escape") closeLetter();
};
renderMenu();
choose(0);
const HELP_TEXT =
  "Не потерялся? Вот как здесь всё устроено.\n\n" +
  "📖 Меню на столе — нажми на него и выбери десерт, он появится на тарелке.\n\n" +
  "🍰 Тарелка — нажми, чтобы прочитать историю блюда. Если нажать несколько раз подряд, некоторые блюда откроют свои песни и произведения.\n\n" +
  "☎ Телефон — ответь на звонок. Каждый раз звонит кто-то новый.\n\n" +
  "🕯 Свеча — загадай желание.\n\n" +
  "Если что-то застряло, закрой письмо крестиком и попробуй ещё раз. А некоторые предметы реагируют, если нажимать на них быстро и настойчиво… 🌙";

const helpBtn = document.getElementById("help");
helpBtn.onclick = () => {
  helpBtn.classList.remove("pulse");
  openLetter("Как здесь всё устроено", HELP_TEXT);
};

let helpIdle = setTimeout(() => helpBtn.classList.add("pulse"), 20000);
document.addEventListener("click", () => {
  helpBtn.classList.remove("pulse");
  clearTimeout(helpIdle);
  helpIdle = setTimeout(() => helpBtn.classList.add("pulse"), 20000);
});
</script>
